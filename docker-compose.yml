services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance_api
    ports:
      - "5433:5432"
    volumes:
      - finance_api_pgdata:/var/lib/postgresql/data

volumes:
  finance_api_pgdata:
